name: CI/CD

on:
    - push

jobs:
    build:
        name: Release
        runs-on: ubuntu-latest

        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  # npm >= 11.5.1 is required for trusted publishing (OIDC) to the npm registry
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Run ESLint
              run: npm run lint

            - name: Run Prettier check
              run: npm run pretty-check

            - name: Build JS File
              run: npm run build

            # Publishes to npm with trusted publishing (OIDC, see "id-token: write" above): no NPM_TOKEN needed.
            # The trusted publisher (this repository + this workflow file) is configured on npmjs.com, in the
            # package settings of @workadventure/upload-maps.
            - name: Run Semantic Release
              if: github.ref == 'refs/heads/master'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release
